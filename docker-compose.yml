# Unified platform stack: Postgres + one Python FastAPI backend + one React frontend.
# Run: docker compose up --build -d  (frontend :8080, backend :8002, db :5433)
services:
  db:
    image: postgres:16-alpine
    container_name: platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: platform_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/app
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      NOTES_PASSWORD: ${NOTES_PASSWORD:-notes123}
      RESUME_PASSWORD: ${RESUME_PASSWORD:-resume123}
      OPTION_PASSWORD: ${OPTION_PASSWORD:-option123}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Optional — only needed for resume → email send
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-Job Application}
    ports:
      - "${API_HOST_PORT:-8002}:8000"

  frontend:
    build:
      context: ./newclient
      args:
        VITE_API_URL: /api/v1/
        VITE_OPTION_API_URL: /api/v1/option
    container_name: platform_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  pg_data:
