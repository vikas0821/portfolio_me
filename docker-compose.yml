services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: portfolio_mongodb
    restart: unless-stopped
    command: ["bash", "-c", "mongod --bind_ip_all 2>&1 | grep -v '\"s\":\"I\"'"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend (Express API + portfolio domain, single process) ──────────────────
  backend:
    build:
      context: .
      dockerfile: apigateway/Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HTTP_PORT: "3000"
      HOST_NAME: "0.0.0.0"
      MONGO_URI: mongodb://mongodb:27017/portfolio
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-admin-secret}
    ports:
      - "3000:3000"

  # ── Seed (runs once then exits) ──────────────────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    container_name: portfolio_seed
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017/portfolio

  # ── Frontend (Nginx) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./newclient
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
